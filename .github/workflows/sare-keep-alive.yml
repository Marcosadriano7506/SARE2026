name: SARE Keep Alive

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sare-keep-alive.yml"
  schedule:
    # Render Free dorme após 15 min sem tráfego.
    # O intervalo de 8 min deixa margem para pequenos atrasos do scheduler.
    - cron: "4,12,20,28,36,44,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sare-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping SARE production health endpoint
        run: |
          set -euo pipefail
          URL="https://sare.cieducba.com.br/health"
          echo "Checking $URL"
          curl             --fail             --silent             --show-error             --location             --max-time 30             --retry 2             --retry-delay 2             --user-agent "SARE-KeepAlive/1.0"             "$URL"
          echo
          echo "SARE respondeu com sucesso."
