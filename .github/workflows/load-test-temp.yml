name: SARE Realistic Open-Class Burst

on:
  push:
    branches:
      - load-test-10-15-20260913
    paths:
      - ".github/workflows/load-test-temp.yml"

permissions:
  contents: read

jobs:
  open-class-burst:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Warm up homologation
        run: |
          python - <<'PY'
          import urllib.request
          with urllib.request.urlopen("https://sare-homologacao.onrender.com/health", timeout=30) as r:
              print("health:", r.status, r.read().decode())
          PY

      - name: 10 applicators — simultaneous Open class click
        run: |
          python scripts/load_test_realistic.py \
            --base-url https://sare-homologacao.onrender.com \
            --users 10 \
            --timeout 30

      - name: Cooldown
        run: sleep 10

      - name: 15 applicators — simultaneous Open class click
        run: |
          python scripts/load_test_realistic.py \
            --base-url https://sare-homologacao.onrender.com \
            --users 15 \
            --timeout 30
