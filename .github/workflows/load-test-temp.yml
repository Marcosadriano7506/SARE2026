name: SARE Realistic Load Test 10-15

on:
  push:
    branches:
      - load-test-10-15-20260913
    paths:
      - ".github/workflows/load-test-temp.yml"

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Warm up homologation
        run: |
          python - <<'PY'
          import urllib.request
          with urllib.request.urlopen("https://sare-homologacao.onrender.com/health", timeout=30) as r:
              print("health:", r.status, r.read().decode())
          PY

      - name: Diagnostic — 1 applicator
        continue-on-error: true
        run: |
          python scripts/load_test.py \
            --base-url https://sare-homologacao.onrender.com \
            --scenario applicator \
            --users 1 \
            --concurrency 1 \
            --reads 2 \
            --prefix load \
            --timeout 30 \
            --max-error-rate 0.00 \
            --max-p95 5.0

      - name: Stage 1 — 10 simultaneous applicators
        continue-on-error: true
        run: |
          python scripts/load_test.py \
            --base-url https://sare-homologacao.onrender.com \
            --scenario applicator \
            --users 10 \
            --concurrency 10 \
            --reads 2 \
            --prefix load \
            --timeout 30 \
            --max-error-rate 0.00 \
            --max-p95 5.0

      - name: Cooldown
        run: sleep 10

      - name: Stage 2 — 15 simultaneous applicators
        continue-on-error: true
        run: |
          python scripts/load_test.py \
            --base-url https://sare-homologacao.onrender.com \
            --scenario applicator \
            --users 15 \
            --concurrency 15 \
            --reads 2 \
            --prefix load \
            --timeout 30 \
            --max-error-rate 0.00 \
            --max-p95 5.0
