name: SARE Temporary Load Test

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/load-test-temp.yml"

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Warm up homologation
        run: |
          python - <<'PY'
          import urllib.request
          with urllib.request.urlopen("https://sare-homologacao.onrender.com/health", timeout=30) as r:
              print("health:", r.status, r.read().decode())
          PY

      - name: Stage 1 — 20 users
        continue-on-error: true
        run: |
          python scripts/load_test.py             --base-url https://sare-homologacao.onrender.com             --scenario applicator             --users 20             --concurrency 10             --reads 2             --prefix load             --password 'LoadSare2026-Test-9x!'             --timeout 30             --max-error-rate 0.02             --max-p95 5.0

      - name: Stage 2 — 50 users
        continue-on-error: true
        run: |
          python scripts/load_test.py             --base-url https://sare-homologacao.onrender.com             --scenario applicator             --users 50             --concurrency 25             --reads 2             --prefix load             --password 'LoadSare2026-Test-9x!'             --timeout 30             --max-error-rate 0.02             --max-p95 5.0

      - name: Stage 3 — 100 users
        continue-on-error: true
        run: |
          python scripts/load_test.py             --base-url https://sare-homologacao.onrender.com             --scenario applicator             --users 100             --concurrency 50             --reads 2             --prefix load             --password 'LoadSare2026-Test-9x!'             --timeout 30             --max-error-rate 0.02             --max-p95 5.0
