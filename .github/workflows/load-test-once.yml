name: One-time SARE Load Test

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/load-test-once.yml"
      - "scripts/load_test.py"

jobs:
  staged-load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Warm up homologation
        run: |
          python - <<'PY'
          import urllib.request
          with urllib.request.urlopen("https://sare-homologacao.onrender.com/health", timeout=30) as response:
              print("health:", response.status, response.read().decode())
          PY

      - name: Diagnostic — 1 applicator
        run: |
          python scripts/load_test.py \
            --base-url https://sare-homologacao.onrender.com \
            --scenario applicator \
            --users 1 \
            --concurrency 1 \
            --reads 1 \
            --prefix load \
            --password "SareDemo2026!" \
            --max-error-rate 0.00 \
            --max-p95 10.0

      - name: Stage 1 — 20 applicators
        run: |
          python scripts/load_test.py \
            --base-url https://sare-homologacao.onrender.com \
            --scenario applicator \
            --users 20 \
            --concurrency 10 \
            --reads 2 \
            --prefix load \
            --password "SareDemo2026!" \
            --max-error-rate 0.02 \
            --max-p95 5.0

      - name: Stage 2 — 50 applicators
        run: |
          python scripts/load_test.py \
            --base-url https://sare-homologacao.onrender.com \
            --scenario applicator \
            --users 50 \
            --concurrency 25 \
            --reads 2 \
            --prefix load \
            --password "SareDemo2026!" \
            --max-error-rate 0.02 \
            --max-p95 5.0

      - name: Stage 3 — 100 applicators
        run: |
          python scripts/load_test.py \
            --base-url https://sare-homologacao.onrender.com \
            --scenario applicator \
            --users 100 \
            --concurrency 50 \
            --reads 2 \
            --prefix load \
            --password "SareDemo2026!" \
            --max-error-rate 0.02 \
            --max-p95 6.0
